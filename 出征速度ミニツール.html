<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出征速度ボーナス計算</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;padding:24px;color:#172033}
.card{max-width:420px;margin:40px auto;background:white;padding:24px;border-radius:20px;box-shadow:0 8px 30px #0001}
h1{font-size:22px;margin-top:0}
label{display:block;margin:18px 0 8px;font-weight:700}
input{box-sizing:border-box;width:100%;font-size:22px;padding:14px;border:2px solid #dbe2ee;border-radius:12px}
.result{margin-top:20px;background:#eef6ff;border-radius:14px;padding:18px;text-align:center}
.num{font-size:36px;font-weight:800;color:#1976d2}
small{color:#667085}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#1976d2;color:white;font-size:16px}
</style>
</head>
<body>
<div class="card">
<h1>🚀 出征速度ボーナス計算</h1>
<small>10%ボーナス時の秒数 → 40%ボーナス時の秒数</small>
<label for="sec">現在の秒数</label>
<input id="sec" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例：36" autofocus>
<div class="result">
<div>40%ボーナス時</div>
<div class="num" id="result">— 秒</div>
</div>
<button onclick="document.getElementById('sec').value='';document.getElementById('result').textContent='— 秒';document.getElementById('sec').focus()">クリア</button>
</div>
<script>
const sec=document.getElementById('sec'), result=document.getElementById('result');
function calc(){
 const v=parseFloat(sec.value);
 if(!Number.isFinite(v)){result.textContent='— 秒';return;}
 const x=v*1.10/1.40;
 result.textContent=x.toFixed(2).replace(/\.00$/,'')+' 秒';
}
sec.addEventListener('input',calc);
</script>
</body>
</html>
